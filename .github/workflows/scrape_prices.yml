name: Daily Price Scraper

on:
  schedule:
    # Runs at 03:00 UTC daily -- 1h after sync_opendb so data is fresh.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Single category to scrape (leave empty for all)'
        required: false
        default: ''

jobs:
  scrape:
    # Runs on GitHub-hosted ubuntu-latest (no OOM), but all network traffic
    # is routed through a Tailscale exit node on the home Pi so Amazon sees
    # the residential IP instead of an Azure datacenter IP.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Auth: an OAuth client (TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET) never
      # expires and wins when set. TS_AUTHKEY is the legacy fallback -- auth
      # keys expire after at most 90 days, which silently broke this job.
      - name: Connect to Tailscale exit node (residential IP)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --exit-node=100.101.155.64 --exit-node-allow-lan-access=false

      # The action does not fail the step when every `tailscale up` retry
      # fails, so check the tunnel explicitly. Scraping from the Azure IP
      # only gets the run bot-blocked.
      - name: Verify exit node is active
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            if sudo tailscale status --json \
                | jq -e '.BackendState == "Running" and (.ExitNodeStatus.Online // false)' >/dev/null; then
              echo "Exit node online -- traffic leaves via the residential IP."
              exit 0
            fi
            sleep 5
          done
          sudo tailscale status || true
          echo "::error title=Tailscale exit node not active::Refusing to scrape from a datacenter IP. Check the TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET (or TS_AUTHKEY) secrets and that the Pi exit node 100.101.155.64 is online and advertising as exit node."
          exit 1

      # The HTTP-first scrape path uses the global fetch API, which needs
      # Node 18+. Pin it instead of relying on whatever the runner image ships.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        working-directory: scraper
        shell: bash
        run: npm ci

      - name: Configure git
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run price scraper
        working-directory: scraper
        shell: bash
        run: node scraper.js "${{ github.event.inputs.category }}"

      - name: Push commits
        if: always()
        shell: bash
        run: |
          git add processed_data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update prices (partial) [skip ci]"
          fi
          BRANCH="${{ github.ref_name }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push && break
            echo "Push conflict -- retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
